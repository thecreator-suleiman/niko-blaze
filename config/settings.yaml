# NIKO BLAZE — main configuration. Every value can be changed without touching code.
artist: Niko Blaze
timezone: Africa/Kigali

generation:
  provider: kaggle            # Step 2 done (kaggle | local_acestep | none)
  model_id: ACE-Step/acestep-v15-xl-turbo-diffusers   # MIT licence
  fallback_model_id: ACE-Step/acestep-v15-xl-sft-diffusers   # MIT licence (diffusers format)
  inference_steps: 8          # turbo = 8; raise to 30-50 for sft/base
  candidates_per_song: 2      # generate N takes, keep the best that passes QC
  max_attempts_per_song: 3    # after this, the brief is abandoned (never published)
  kaggle_kernel_slug: niko-blaze-gen
  kaggle_weekly_gpu_hours: 30 # Kaggle free quota (check your account page; Kaggle may change it)
  kaggle_safety_margin_hours: 4
  est_gpu_seconds_per_take: 90  # conservative T4 estimate incl. transcription; refined from real runs
  batch_overhead_seconds: 900   # install + model download per Kaggle run
  batch_timeout_hours: 11

schedule:                     # quality over quantity (YouTube "inauthentic content" safe)
  single_department: afrobeats
  single_days: [Mon]          # a new single is generated on these days (published Friday)
  mix_rotation: [reggae, afrobeats, relaxation]   # one 1-hour mix per week, genre rotates weekly
  mix_tracks_per_day: 3       # new tracks/day for this week's mix -> ~100% new music every mix
  shorts_per_single: 3        # chorus Shorts cut from each single, spread over the week
  mix_target_minutes: 60
  mix_min_minutes: 50
  track_reuse_cooldown_days: 60

durations:                    # seconds
  afrobeats: {min: 140, max: 235}
  reggae: {min: 150, max: 235}
  relaxation: {min: 200, max: 360}
  single_hard_max: 240        # individual songs never exceed 4:00

quality:
  min_score: 70
  vocal_min_lyric_match: 0.35   # share of lyric words recognised in the sung audio
  vocal_good_lyric_match: 0.55
  instrumental_max_words: 12    # relaxation tracks must not contain sung words

mastering:
  sample_rate: 48000
  default: {lufs: -14.0, true_peak: -1.0, lra: 11}
  relaxation: {lufs: -16.0, true_peak: -1.5, lra: 15}
  compressor: {threshold_db: -20, ratio: 1.8, attack_ms: 25, release_ms: 300}
  aac_bitrate: 384k

lyrics:
  providers: [github_models, groq, cerebras, mistral, openrouter, cloudflare, sambanova, nvidia, gemini]   # free tiers, auto-failover in this order
  github_model: openai/gpt-4.1-mini
  gemini_model: gemini-2.5-flash
  groq_model: llama-3.3-70b-versatile
  openrouter_model: meta-llama/llama-3.3-70b-instruct:free
  cloudflare_model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
  mistral_model: mistral-small-latest
  cerebras_model: llama-3.3-70b
  sambanova_model: Meta-Llama-3.3-70B-Instruct
  nvidia_model: meta/llama-3.3-70b-instruct
  max_rewrites: 3
  history_similarity_max: 0.18

publishing:
  # Order of publishers. upload_post works immediately (public, free 10 uploads/month).
  # youtube_api is unlimited but stays private until Google's free audit is approved (then set audited: true).
  order: [youtube_api_audited, upload_post, youtube_api_private]
  upload_post_monthly_limit: 10
  max_per_week: {single: 1, mix: 1, short: 3}
  publish_days: {single: Fri, mix: Sun, short: [Tue, Thu, Sat]}

youtube:
  audited: false            # set true when Google approves your API audit
  enabled: false            # turn on after setup (docs/SETUP.md)
  privacy: private          # private | unlisted | public | scheduled  (unverified API projects: private only)
  schedule_local_times: {single: "18:00", mix: "20:00", short: "17:00"}
  max_uploads_per_day: 4
  category_id: "10"         # Music
  contains_synthetic_media: true   # YouTube altered/synthetic content disclosure — never set false
  set_thumbnails: true      # needs a phone-verified channel


storage:
  release_prefix: media
  keep_originals_days: 60   # originals are pruned after this; masters are kept

# Keys that expire. From remind_from onward, Telegram sends a reminder every day until you
# replace the key and update `expires` here (or delete the entry).
expiring_credentials:
  - {secret: OPENROUTER_API_KEY, service: OpenRouter, expires: 2027-05-16, remind_from: 2027-05-01,
     renew_at: "https://openrouter.ai/settings/keys"}
