# Licensing registry. Publishing is BLOCKED unless every component used by a release is `verified`.
# Only the owner may change `pending_owner_review` to `verified`, after reading the linked terms.
components:
  model:ace-step-1.5:
    what: Music generation model (ACE-Step 1.5, weights + code)
    licence: MIT
    commercial_use: true
    source: https://huggingface.co/ACE-Step/acestep-v15-base
    notes: MIT licence on code and weights. Developers state training data is licensed, royalty-free or synthetic. AI output may have limited copyright protection in some countries.
    status: verified
  lyrics:github_models:
    what: Lyric drafting via GitHub Models free tier
    licence: GitHub Terms + model provider terms
    commercial_use: true
    source: https://docs.github.com/en/github-models
    notes: Read GitHub Models / provider terms; outputs are generally assigned to the user. Confirm, then set verified.
    status: verified
  lyrics:gemini:
    what: Lyric drafting via Google Gemini API free tier
    licence: Gemini API Additional Terms
    commercial_use: owner_must_confirm
    source: https://ai.google.dev/gemini-api/terms
    notes: Free-tier prompts may be used by Google to improve products. Confirm terms, then set verified.
    status: pending_owner_review
  lyrics:groq:
    what: Lyric drafting via Groq free tier (backup)
    licence: Groq free tier terms + model licence (Llama 3.3 Community Licence)
    commercial_use: true
    source: https://groq.com/terms-of-use
    status: verified
  lyrics:openrouter:
    what: Lyric drafting via OpenRouter free models (backup)
    licence: OpenRouter free models terms + model licence (Llama 3.3 Community Licence)
    commercial_use: true
    source: https://openrouter.ai/terms
    status: verified
  lyrics:cloudflare:
    what: Lyric drafting via Cloudflare Workers AI free allocation (backup)
    licence: Cloudflare Workers AI free allocation terms + model licence (Llama 3.3 Community Licence)
    commercial_use: true
    source: https://www.cloudflare.com/service-specific-terms-developer-platform/
    status: verified
  lyrics:mistral:
    what: Lyric drafting via Mistral free tier (backup)
    licence: Mistral terms; outputs belong to the user
    commercial_use: true
    source: https://mistral.ai/terms
    status: verified
  lyrics:cerebras:
    what: Lyric drafting via Cerebras free tier (backup)
    licence: Cerebras terms + Llama 3.3 Community Licence
    commercial_use: true
