name: Control (manual)
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [generate-song, generate-mix, retry-production, reprocess, withdraw, live-check, test-backup, retry-upload, pause, resume, publish, status, telegram-test, gpu-log, gpu-fetch]
      department:
        type: choice
        default: afrobeats
        options: [afrobeats, reggae, relaxation]
      target:
        description: "song id (+ reason) for withdraw"
        type: string
        default: ""
permissions:
  contents: write
  actions: write
  models: read
concurrency: {group: nikoblaze-state, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
      UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pip install -q kaggle six faster-whisper
      - name: Run action
        run: |
          case "${{ inputs.action }}" in
            generate-song) python -m nikoblaze generate-song "${{ inputs.department }}" ;;
            generate-mix)  python -m nikoblaze mixes "${{ inputs.department }}" ;;
            withdraw)      python -m nikoblaze withdraw ${{ inputs.target }} ;;
            gpu-fetch)     mkdir -p gpu_out && kaggle kernels output "$KAGGLE_USERNAME/niko-blaze-gen" -p gpu_out || true ;;
            *)             python -m nikoblaze "${{ inputs.action }}" ;;
          esac
      - if: inputs.action == 'gpu-fetch'
        uses: actions/upload-artifact@v4
        with: {name: gpu-output, path: gpu_out, retention-days: 3}
      - if: always()
        run: python -m nikoblaze state-push
