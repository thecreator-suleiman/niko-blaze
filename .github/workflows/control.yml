name: Control (manual)
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [generate-song, generate-mix, retry-production, retry-upload, pause, resume, publish, status]
      department:
        type: choice
        default: afrobeats
        options: [afrobeats, reggae, relaxation]
permissions:
  contents: write
  models: read
concurrency: {group: nikoblaze-state, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pip install -q kaggle faster-whisper
      - name: Run action
        run: |
          case "${{ inputs.action }}" in
            generate-song) python -m nikoblaze generate-song "${{ inputs.department }}" ;;
            generate-mix)  python -m nikoblaze mixes "${{ inputs.department }}" ;;
            *)             python -m nikoblaze "${{ inputs.action }}" ;;
          esac
      - if: always()
        run: python -m nikoblaze state-push
